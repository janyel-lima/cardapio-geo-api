version: 2

updates:
  # ── Dependências Rust ────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Maceio
    # PRs pequenos: uma dep por vez — facilita revisão e bisect de regressões
    open-pull-requests-limit: 5
    # Labels para triagem automática
    labels:
      - dependencies
      - rust
    # Ignora major bumps automáticos — requer decisão consciente
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Maceio
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"