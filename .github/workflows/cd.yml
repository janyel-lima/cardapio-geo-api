name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # v1.0.0, v2.3.1, etc.

  # Permite disparar manualmente pelo GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Deploy nunca deve ser cancelado no meio

jobs:
  # ── Gate: CI precisa passar antes do deploy ───────────────────────────────
  # Reutiliza o workflow de CI para não duplicar jobs
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ── Deploy para Fermyon Cloud ─────────────────────────────────────────────
  deploy:
    name: Deploy → Fermyon Cloud
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # Baixa o .wasm já compilado pelo job de CI — evita rebuild
      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: cardapio-geo-api-wasm
          path: target/wasm32-wasip1/release/
        # Se o download falhar (ex: artifact expirado), rebuilda
        continue-on-error: true

      # Rebuild caso o artifact não esteja disponível
      - name: Build (fallback)
        run: |
          if [ ! -f target/wasm32-wasip1/release/cardapio_geo_api.wasm ]; then
            echo "Artifact não encontrado — fazendo build..."
            cargo build --target wasm32-wasip1 --release
          fi

      # Instala Spin CLI (versão travada para builds reproduzíveis)
      - name: Install Spin CLI
        run: |
          SPIN_VERSION="v2.7.0"
          curl -fsSL \
            "https://github.com/fermyon/spin/releases/download/${SPIN_VERSION}/spin-${SPIN_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin spin
          spin --version

      # Deploy para o Fermyon Cloud
      # FERMYON_CLOUD_TOKEN: Settings → Secrets → Actions → New secret
      # Obtido em: https://cloud.fermyon.com/user-settings
      - name: Deploy
        id: deploy
        env:
          FERMYON_CLOUD_TOKEN: ${{ secrets.FERMYON_CLOUD_TOKEN }}
        run: |
          spin deploy 2>&1 | tee deploy.log
          # Extrai a URL do output do spin deploy para a UI do GitHub
          APP_URL=$(grep -oP 'https://[^\s]+fermyon\.app' deploy.log | head -1 || echo "")
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.app_url != ''
        run: |
          APP_URL="${{ steps.deploy.outputs.app_url }}"
          echo "Testando ${APP_URL}/health …"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${APP_URL}/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check falhou — HTTP $STATUS"
            exit 1
          fi
          echo "✅ Deploy OK — ${APP_URL}"