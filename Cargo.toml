[package]
name    = "cardapio-geo-api"
version = "0.1.0"
edition = "2021"

# WASI component — exported as a cdylib for Spin
[lib]
crate-type = ["cdylib"]

[dependencies]
spin-sdk   = "2.2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"

[profile.release]
opt-level = "s"   # optimize for size — smaller .wasm