[package]
name    = "cardapio-geo-api"
version = "0.1.0"
edition = "2021"

# cdylib  → .wasm exportado pelo Spin
# lib     → .rlib nativo para `cargo test --lib` (não entra no .wasm)
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
spin-sdk   = "2.2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
thiserror  = "1"    # erros de biblioteca com Display derivado

[profile.release]
opt-level = "s"     # otimiza tamanho — .wasm menor
lto       = true    # link-time optimisation — remove código morto